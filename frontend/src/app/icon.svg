<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="cb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="lens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="32" height="32" rx="8" fill="url(#cb-grad)" />

  <!-- Top Antenna Light -->
  <circle cx="16" cy="5.5" r="1.25" fill="#ffffff" />
  <rect x="15.25" y="6.5" width="1.5" height="2" fill="#ffffff" rx="0.5" />

  <!-- Visor Container -->
  <rect x="5.5" y="9" width="21" height="15" rx="4.5" fill="#09090b" fill-opacity="0.9" />

  <!-- Left Camera Lens Eye -->
  <circle cx="11.5" cy="16.5" r="3" fill="url(#lens-grad)" />
  <circle cx="11.5" cy="16.5" r="1.5" fill="#09090b" />
  <circle cx="12" cy="16" r="0.65" fill="#38bdf8" />

  <!-- Right Camera Lens Eye -->
  <circle cx="20.5" cy="16.5" r="3" fill="url(#lens-grad)" />
  <circle cx="20.5" cy="16.5" r="1.5" fill="#09090b" />
  <circle cx="21" cy="16" r="0.65" fill="#38bdf8" />

  <!-- Friendly Smile Arc -->
  <path d="M13 20.8 C 14.5 22.2, 17.5 22.2, 19 20.8" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
</svg>
